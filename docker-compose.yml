version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Add any necessary API keys here, e.g.:
      - GROQ_API_KEY=your_key_here
    volumes:
      - backend_data:/app/backend/.mongita
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Assuming the client runs this locally, localhost:5000 points to their own machine's port 5000
        - VITE_API_BASE_URL=http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
